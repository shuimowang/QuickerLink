name: Bug report
description: Report a reproducible problem in Quicker Link
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include verification codes, private action data, or other credentials.
  - type: input
    id: app-version
    attributes:
      label: Quicker Link version
    validations:
      required: true
  - type: input
    id: quicker-version
    attributes:
      label: Quicker version
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [WSS, WS]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized connection log
