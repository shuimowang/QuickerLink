name: Pairing Tool and Update Index Pages

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      expected_release_tag:
        description: Optional release tag that must be present in the generated index
        required: false
        type: string
  workflow_call:
    inputs:
      expected_release_tag:
        description: Release tag that must be present before Pages is deployed
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_REPOSITORY: shuimowang/QuickerLink
      EXPECTED_RELEASE_TAG: ${{ inputs.expected_release_tag || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Test update index generator
        run: node --test .github/scripts/generate-update-index.test.mjs

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$UPDATE_REPOSITORY"
          test ! -e _site
          mkdir _site
          cp -R tools/. _site/
          cp tools/pairing.html _site/index.html

      - name: Generate authenticated update index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attempts=1
          if [[ -n "$EXPECTED_RELEASE_TAG" ]]; then
            attempts=5
          fi

          for ((attempt = 1; attempt <= attempts; attempt++)); do
            rm -f "$RUNNER_TEMP/releases.json" _site/update-v1.json
            if gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$UPDATE_REPOSITORY/releases?per_page=10" \
              --jq '[.[] | {draft, prerelease, tag_name, html_url, assets: [.assets[] | {state, name, size, browser_download_url}]}]' \
              > "$RUNNER_TEMP/releases.json"; then
              arguments=(
                --input "$RUNNER_TEMP/releases.json"
                --output _site/update-v1.json
                --repository "$UPDATE_REPOSITORY"
              )
              if [[ -n "$EXPECTED_RELEASE_TAG" ]]; then
                arguments+=(--expected-tag "$EXPECTED_RELEASE_TAG")
              fi
              if node .github/scripts/generate-update-index.mjs "${arguments[@]}"; then
                exit 0
              fi
            fi

            if ((attempt < attempts)); then
              sleep $((attempt * 2))
            fi
          done

          echo "Failed to generate a trusted update index" >&2
          exit 1

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
