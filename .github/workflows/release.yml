name: Android Prerelease

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Test and lint without signing secrets
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --no-configuration-cache

      - name: Validate signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quicker-link-release.jks"

      - name: Build signed release
        env:
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/quicker-link-release.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache

      - name: Verify tag, signature, and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          metadata="app/build/outputs/apk/release/output-metadata.json"
          test -f "$apk"
          test -f "$metadata"
          version_name="$(jq -r '.elements[0].versionName' "$metadata")"
          test "$GITHUB_REF_NAME" = "v$version_name"
          signature_report="$RUNNER_TEMP/apksigner-report.txt"
          expected_certificate="55faf4a1587b587abf0e427c0802993235dae81e3c05b621c2fed3f57a6089c7"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$signature_report"
          grep -Fqx "Number of signers: 1" "$signature_report"
          grep -Fqx "Signer #1 certificate SHA-256 digest: $expected_certificate" "$signature_report"
          mkdir -p dist
          release_apk="quicker-link-${GITHUB_REF_NAME}-release.apk"
          cp "$apk" "dist/$release_apk"
          cd dist
          sha256sum "$release_apk" > "$release_apk.sha256"
          sha256sum --check "$release_apk.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/quicker-link-${GITHUB_REF_NAME}-release.apk" \
            "dist/quicker-link-${GITHUB_REF_NAME}-release.apk.sha256" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Quicker Link $GITHUB_REF_NAME"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/quicker-link-release.jks"

  dispatch-pages:
    needs: release
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch Pages deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run pages.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          --field expected_release_tag="$GITHUB_REF_NAME"
